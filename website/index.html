		<script type="application/ld+json">
			{

		<!-- ponytail: hand-mirrored from src/App.svelte faqs[], keep in sync manually; generate at build time if it drifts -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "FAQPage",
				"mainEntity": [
					{
						"@type": "Question",
						"name": "Didn’t GitHub just ship this?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "GitHub’s native pull requests dashboard is good — but it still lives behind a site visit, a search, and a set of filters you re-apply every time. PR Pulse was never about a prettier list. It’s about the feedback loop: single click from any tab, no page load, filters already where you left them."
						}
					},
					{
						"@type": "Question",
						"name": "Can I see private PRs?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes — install PR Pulse and connect a GitHub token during setup."
						}
					},
					{
						"@type": "Question",
						"name": "Which platforms do you support?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "GitHub, right now. Feel free to raise a PR for others."
						}
					},
					{
						"@type": "Question",
						"name": "Is this free?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes — and open-source as well."
						}
					},
					{
						"@type": "Question",
						"name": "What’s the tech stack?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Svelte, because React is too hyped and bloated."
						}
					}
